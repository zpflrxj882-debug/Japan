 const session=state.session&&state.session.keys.length>state.session.index;
 const days=new Set(state.history.map(x=>L.day(x.at)));
 const todayDate=today(),hasToday=days.has(todayDate);
 const topics=[["h","あ","히라가나","일본어 기본 글자 46개"],["k","ア","가타카나","외래어 글자 46개"],["v","旅","기초 단어·여행 표현","일상에서 사용하는 133개 표현"]];
 app.innerHTML=`<div class="top"><div class="brand">JAPAN <em>/</em> STUDIO</div><span class="mut">일본어 전용 학습</span></div>
 <section class="hero"><div class="kicker">YOUR DAILY JAPANESE</div><h1>${hasToday?"오늘도 일본어 한마디.":"오늘은 한 글자부터,\n내일은 한 문장까지."}</h1><p>읽고 · 듣고 · 직접 떠올리고 · 다시 말해봐요.</p></section>
 <nav class="home-nav" aria-label="학습 메뉴"><a href="#today">오늘</a><a href="#courses">학습실</a><a href="#records">내 기록</a></nav>
 <div class="stats"><div class="stat"><b>${total}</b><span>학습한 글자·표현</span></div><div class="stat"><b>${pending}</b><span>지금 복습할 항목</span></div><div class="stat"><b>${state.seen}</b><span>정답 누적</span></div></div>
 <section id="today" class="focus"><div class="focus-label">✦ 오늘의 추천 학습</div>
 <button class="primary" onclick="${session?"resumeQuiz()":"startDaily()"}">${session?"이어서 공부하기 →":"오늘의 일본어 시작하기 →"}</button>
 <div class="quick"><button onclick="startQuiz()">🧠 10문제 복습</button><button onclick="missionPage()">🗣️ 여행 회화</button></div></section>
 <details class="study-room" id="courses"><summary>📚 학습실 전체 보기</summary><div class="room-body">
 ${topics.map(([t,g,name,desc])=>`<div class="tile"><div class="glyph">${g}</div><div class="detail"><b>${name}</b><div class="mut">${desc} · ${stats(t)}/${DATA[t].length}</div></div><button onclick="start('${t}')">학습</button></div>`).join("")}
 <button class="sub" onclick="startQuiz()">읽기·기억 퀴즈</button>
 <button class="sub" onclick="reviewMissed()">틀린 글자 집중 복습</button>
 <button class="sub" onclick="weakPage()">취약 카드 관리</button>
 <button class="sub" onclick="missionPage()">여행 회화 미션</button></div></details>
 <details class="study-room" id="records"><summary>📈 내 학습 기록·백업</summary><div class="room-body">
 <p class="mut">최근 7일 학습 ${[...days].filter(d=>d<=todayDate&&d>=L.day(Date.now()-6*86400000)).length}일 · 기록된 풀이 ${state.history.length}회</p>
 <button class="sub" onclick="statsPage()">학습 통계 · JSON 백업·복원</button></div></details>
 <div class="note"><b>처음 일본어를 배우고 있나요?</b><div class="mut">히라가나부터 시작해도 좋아요. 로마자와 한글 읽기 힌트는 학습 카드에 제공하고, 퀴즈에서는 가려서 기억을 확인해요. 한글 표기는 근사치라서 일본어 발음도 함께 들어 주세요.</div></div>
 <div class="foot">영어 Oxford 앱과 별개의 저장소·학습 기록을 사용합니다.</div>`;
}
function startDaily(){
 const ready=ids.filter(id=>state.review[id]&&state.review[id].next<=Date.now());
 if(ready.length)return begin(L.queue(state,ready),true);
 const next=["h","k","v"].find(t=>DATA[t].some((_,i)=>!state.learned[t+i]));
 if(next)return start(next);
 return begin(L.queue(state,ids),true);
}
function resumeQuiz(){
 const x=state.session;if(!x||!x.keys?.length)return goHome();
 quiz=x.keys.filter(id=>ids.includes(id));qidx=Math.min(x.index,quiz.length);answered=false;recall=x.recall;
 if(qidx>=quiz.length){state.session=null;save();return goHome()}
 view="quiz";render();
}

function start(t){mode=t;idx=DATA[t].findIndex((_,i)=>!state.learned[t+i]);if(idx<0)idx=0;learnStart=idx;learnEnd=Math.min(DATA[t].length,idx+10);view="learn";render()}
function learn(){const arr=DATA[mode],x=arr[idx],key=mode+idx;app.innerHTML=`<button class="back" onclick="goHome()">← 홈</button><div class="top"><b>${label(mode)} 배우기</b><span class="mut">이번 세트 ${idx-learnStart+1} / ${learnEnd-learnStart} · 전체 ${idx+1}/${arr.length}</span></div><div class="progress"><i style="width:${(idx-learnStart+1)/(learnEnd-learnStart)*100}%"></i></div><div class="card"><span class="pill">${label(mode)}</span><div class="char" style="${mode==="v"?"font-size:clamp(42px,12vw,70px);margin:28px 0 12px":""}">${esc(x[0])}</div><div class="roman">${esc(x[1])}</div><div class="reading">${esc(x[2])}</div><div class="controls"><button onclick="speak('${x[0]}')">🔊 발음 듣기</button><button onclick="practiceSpeech('${x[0]}')">🎤 따라 말하기</button></div><div id="speech-feedback"></div><div class="tip">${mode==="v"?esc(x[3]):"소리를 듣고 직접 따라 말한 다음, 글자 모양을 손가락으로 따라 써 보세요. 일본어 소리와 한글 소리가 완전히 같지는 않아요."}</div></div><div class="controls"><button onclick="move(-1)" ${idx===learnStart?"disabled":""}>← 이전</button><button onclick="mark()">${state.learned[key]?"✓ 학습함":"✓ 배웠어요"}</button></div><button class="primary" onclick="move(1)">${idx===learnEnd-1?"이번 세트 퀴즈 →":"다음 글자 →"}</button><div class="foot">학습 기록은 현재 브라우저에 저장돼요.</div>`}
function mark(){const key=mode+idx;state.learned[key]=true;const now=Date.now();if(!state.review[key])state.review[key]={step:0,next:now+86400000,lastSeen:now};save();render()}
function move(n){if(idx+n<learnStart)return;if(idx+n>=learnEnd){begin(Array.from({length:learnEnd-learnStart},(_,i)=>mode+(learnStart+i)),false);return}idx+=n;render()}
function goHome(){view="home";render()}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function begin(keys,active=false){
 if(!keys.length){alert("지금 복습할 항목이 없어요. 새 글자를 배우거나 나중에 다시 와 주세요.");return}
 quiz=keys.slice(0,10);qidx=0;answered=false;recall=active;view="quiz";
 state.session={keys:quiz.slice(),index:0,recall};save();render()
}
function startQuiz(t){const all=t?ids.filter(id=>id[0]===t):ids;begin(L.queue(state,all))}
function reviewMissed(){begin(ids.filter(id=>(state.weak[id]?.locked||state.mistakes[id]>0)&&(!state.review[id]||state.review[id].next<=Date.now())).slice(0,10),true)}
function quizView(){
 if(qidx>=quiz.length){
  state.session=null;save();
  app.innerHTML=`<button class="back" onclick="goHome()">← 홈</button><div class="card"><div class="char" style="font-size:80px">🎉</div><h2>오늘의 기억 확인 완료!</h2><p>며칠 뒤에도 기억나는지 다시 확인해 보세요.</p></div><button class="primary" onclick="goHome()">홈으로 돌아가기</button>`;return;
 }
 mode=quiz[qidx][0];const i=+quiz[qidx].slice(1),x=DATA[mode][i],arr=DATA[mode];
 let opts=shuffle([i,...shuffle(arr.map((_,j)=>j).filter(j=>j!==i&&arr[j][1]!==x[1])).slice(0,3)]);
 app.innerHTML=`<button class="back" onclick="goHome()">← 홈</button><div class="top"><b>${recall?"힌트 없는 회상":"읽기 퀴즈"} · ${label(mode)}</b><span class="mut">${qidx+1} / ${quiz.length}</span></div>
 <div class="progress"><i style="width:${qidx/quiz.length*100}%"></i></div>
 <div class="card"><span class="pill">${recall?"정답을 보기 전에 소리 내어 말해 보세요":"읽는 법을 골라 보세요"}</span>
 <div class="char" style="${mode==="v"?"font-size:50px;margin:24px 0":""}">${esc(x[0])}</div>
 ${recall?`<p class="mut">먼저 소리를 떠올려 말한 뒤, 스스로 기억했는지 선택해요.</p><div class="controls" id="recall-buttons"><button onclick="recallAnswer(false)">기억 안 나요</button><button onclick="recallAnswer(true)">혼자 기억했어요</button></div>`:
 `<button onclick="speak('${x[0]}')">🔊 소리 듣기</button><div id="options" class="choices">${opts.map(j=>`<button data-j="${j}" onclick="answer(${j})">${esc(arr[j][1])}</button>`).join("")}</div>`}
 <div id="feedback" class="feedback" aria-live="polite"></div></div>
 <button id="next" class="primary" onclick="nextQuestion()" disabled>다음 문제 →</button>`;
}
function finishAnswer(correct,kind){
 if(answered)return;answered=true;
 const key=quiz[qidx],x=DATA[mode][+key.slice(1)];
 const r=L.record(state,key,correct,kind);if(state.session)state.session.index=qidx+1;save();
 document.getElementById("feedback").innerHTML=`<div>${correct?"✓ 기억 확인 완료":"다음에 다시 연습해요"}</div>
 <div>${esc(x[1])} · ${esc(x[2])}</div><small>${kind==="recall"?"스스로 기억했는지 평가한 결과예요. ":"객관식 정답만으로 장기 기억이 확인되지는 않아요. "}${!correct?"10분 뒤 다시 확인할 수 있어요.":r.qualified?"날짜 간격을 둔 복습으로 기록했어요.":"추가 연습으로 기록했어요."}</small>
 <button onclick="speak('${x[0]}')">🔊 일본어 발음 듣기</button>`;
 document.getElementById("next").disabled=false;
}
function answer(j){
 if(answered)return;
 const i=+quiz[qidx].slice(1),correct=j===i,box=document.getElementById("options");
 box.querySelectorAll("button").forEach(b=>{b.disabled=true;if(+b.dataset.j===i)b.classList.add("good");else if(+b.dataset.j===j)b.classList.add("bad")});
 finishAnswer(correct,"quiz");
}
function recallAnswer(ok){if(answered)return;document.getElementById("recall-buttons").hidden=true;finishAnswer(ok,"recall")}
function nextQuestion(){if(!answered)return;qidx++;answered=false;
 if(state.session){state.session.index=qidx;save()}render()
}

render();
</script></body></html>
