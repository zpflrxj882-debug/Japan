<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d36"><title>Japan Studio · 일본어 첫걸음</title>
<style>
:root{--bg:#f5f4ef;--sf:#fffefa;--tx:#1d2926;--mut:#73807b;--bd:#e7e9e2;--ac:#176f62;--accent:#dd866d;--soft:#e5f3eb}
*{box-sizing:border-box}body{background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;margin:0}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--bd);border-radius:14px;padding:13px;background:var(--sf);color:var(--tx)}button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}button:disabled{opacity:.45}main{max-width:530px;margin:auto;padding:22px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.brand{font-weight:900;letter-spacing:.045em}.brand em{font-style:normal;color:var(--ac)}.mut{color:var(--mut);font-size:13px}.hero{background:#173d36;color:#fff;border-radius:29px;padding:25px 24px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"あ";position:absolute;right:-10px;bottom:-50px;color:#ffffff14;font-size:210px;line-height:1}.kicker{font-size:11px;letter-spacing:.18em;color:#a5dfca;font-weight:800}.hero h1{font-size:30px;line-height:1.3;margin:12px 0 9px;letter-spacing:-.04em}.hero p{color:#d5e6df;margin:0;font-size:14px;position:relative;z-index:1}.stats{display:flex;gap:9px;margin:15px 0}.stat{flex:1;background:var(--sf);padding:15px 12px;border:1px solid var(--bd);border-radius:18px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}.section{font-size:14px;font-weight:850;margin:25px 2px 10px;color:var(--mut)}.tile{background:var(--sf);border:1px solid var(--bd);padding:17px;border-radius:20px;margin:9px 0;display:flex;align-items:center;gap:13px}.glyph{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--soft);font-size:27px}.tile .detail{flex:1;min-width:0}.tile b{font-size:17px}.tile button{background:var(--ac);color:white;border:0;font-size:14px;padding:12px}.primary{background:var(--ac);color:#fff;border:0;font-weight:800;min-height:55px;width:100%;margin-top:13px}.sub{width:100%;margin-top:9px}.card{background:var(--sf);border:1px solid var(--bd);border-radius:29px;padding:22px;text-align:center;margin:17px 0}.char{font-size:clamp(86px,23vw,140px);line-height:1.4;font-weight:500}.reading{font-size:24px;font-weight:800;margin-top:4px}.roman{font-size:20px;color:var(--ac);font-weight:700}.pill{display:inline-block;border-radius:99px;background:var(--soft);color:var(--ac);padding:5px 12px;font-size:12px;font-weight:800}.tip{margin-top:15px;padding:14px;border-radius:15px;background:var(--bg);font-size:14px;text-align:left}.controls{display:flex;gap:8px;margin:12px 0}.controls>*{flex:1}.progress{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--ac);transition:width .2s}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:20px}.choices button{font-size:20px;min-height:63px}.choices button.good{background:#dff2e5;border-color:#176f62}.choices button.bad{background:#ffe1dc;border-color:#dd866d}.feedback{font-weight:800;text-align:center;min-height:28px;margin-top:10px}.back{background:transparent;border:0;color:var(--ac);padding-left:0}.hide{display:none}.settings{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:13px}.tiny{font-size:12px;color:var(--mut)}.stroke{font-size:14px;color:var(--mut)}.foot{margin-top:30px;text-align:center;color:var(--mut);font-size:12px}@media(prefers-color-scheme:dark){:root{--bg:#101916;--sf:#1a2621;--tx:#eef4ed;--mut:#a1b1a7;--bd:#314139;--ac:#50d0ad;--soft:#224638}.tile button,.primary{background:#237863;color:white}.hero{background:#173d36}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}textarea{font:inherit;border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--sf);color:var(--tx)}table{text-align:center}th,td{padding:8px}</style></head><body><main id="app"></main><script src="learning.js"></script><script src="features.js"></script><script>
"use strict";
const H=[["あ","a","아"],["い","i","이"],["う","u","우"],["え","e","에"],["お","o","오"],["か","ka","카"],["き","ki","키"],["く","ku","쿠"],["け","ke","케"],["こ","ko","코"],["さ","sa","사"],["し","shi","시"],["す","su","스"],["せ","se","세"],["そ","so","소"],["た","ta","타"],["ち","chi","치"],["つ","tsu","츠"],["て","te","테"],["と","to","토"],["な","na","나"],["に","ni","니"],["ぬ","nu","누"],["ね","ne","네"],["の","no","노"],["は","ha","하"],["ひ","hi","히"],["ふ","fu","후"],["へ","he","헤"],["ほ","ho","호"],["ま","ma","마"],["み","mi","미"],["む","mu","무"],["め","me","메"],["も","mo","모"],["や","ya","야"],["ゆ","yu","유"],["よ","yo","요"],["ら","ra","라"],["り","ri","리"],["る","ru","루"],["れ","re","레"],["ろ","ro","로"],["わ","wa","와"],["を","wo","오"],["ん","n","응/ㄴ"]];
const K=[["ア","a","아"],["イ","i","이"],["ウ","u","우"],["エ","e","에"],["オ","o","오"],["カ","ka","카"],["キ","ki","키"],["ク","ku","쿠"],["ケ","ke","케"],["コ","ko","코"],["サ","sa","사"],["シ","shi","시"],["ス","su","스"],["セ","se","세"],["ソ","so","소"],["タ","ta","타"],["チ","chi","치"],["ツ","tsu","츠"],["テ","te","테"],["ト","to","토"],["ナ","na","나"],["ニ","ni","니"],["ヌ","nu","누"],["ネ","ne","네"],["ノ","no","노"],["ハ","ha","하"],["ヒ","hi","히"],["フ","fu","후"],["ヘ","he","헤"],["ホ","ho","호"],["マ","ma","마"],["ミ","mi","미"],["ム","mu","무"],["メ","me","메"],["モ","mo","모"],["ヤ","ya","야"],["ユ","yu","유"],["ヨ","yo","요"],["ラ","ra","라"],["リ","ri","리"],["ル","ru","루"],["レ","re","레"],["ロ","ro","로"],["ワ","wa","와"],["ヲ","wo","오"],["ン","n","응/ㄴ"]];
const V=[["こんにちは","konnichiwa","안녕하세요","낮에 만났을 때 하는 인사"],["ありがとう","arigatō","고마워요","감사의 표현"],["すみません","sumimasen","실례합니다 / 죄송합니다","사람을 부르거나 사과할 때"],["はい","hai","네","긍정 대답"],["いいえ","iie","아니요","부정 대답"],["みず","mizu","물","식당에서 물을 주문할 때"],["おちゃ","ocha","차","차를 마실 때"],["これ","kore","이것","가까이에 있는 물건"],["いくらですか","ikura desu ka","얼마예요?","가격을 물을 때"],["おいしい","oishii","맛있어요","맛을 표현할 때"],["ください","kudasai","주세요","주문이나 요청"],["えき","eki","역","길 찾을 때"]];
const KEY="japan-studio-v1",DATA={h:H,k:K,v:V},L=JapanLearning;
const ids=Object.entries(DATA).flatMap(([t,a])=>a.map((_,i)=>t+i));
let state=L.blank();try{const raw=localStorage.getItem(KEY);if(raw)state=L.validate(JSON.parse(raw),ids)}catch(e){alert("학습 기록을 읽지 못했어요. 기존 저장 데이터는 유지합니다: "+e.message)}
let view="home",mode="h",idx=0,quiz=[],qidx=0,answered=false,recall=false;
const app=document.querySelector("#app");
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert("저장하지 못했어요. JSON 백업으로 기록을 보관해 주세요.");return false}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function speak(s){if(!("speechSynthesis" in window)){alert("이 기기에서 음성 읽기를 지원하지 않아요.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="ja-JP";u.rate=.78;const voices=speechSynthesis.getVoices();u.voice=voices.find(x=>x.lang==="ja-JP")||voices.find(x=>x.lang.startsWith("ja"))||null;speechSynthesis.speak(u)}
function label(t){return {h:"히라가나",k:"가타카나",v:"기초 단어"}[t]}
function today(){return new Date().toLocaleDateString("sv-SE")}
function due(t){return DATA[t].filter((_,i)=>state.review[t+i]&&state.review[t+i].next<=Date.now()).length}
function stats(t){return DATA[t].filter((_,i)=>state.learned[t+i]).length}
function render(){if(view==="home")home();else if(view==="learn")learn();else if(view==="quiz")quizView();else if(view==="weak")weakPage();else if(view==="stats")statsPage();else if(view==="mission")missionPage()}
function home(){let total=["h","k","v"].reduce((n,t)=>n+stats(t),0),pending=["h","k","v"].reduce((n,t)=>n+due(t),0);app.innerHTML=`<div class="top"><div class="brand">JAPAN <em>/</em> STUDIO</div><span class="mut">일본어 전용 학습</span></div><section class="hero"><div class="kicker">START FROM ZERO</div><h1>오늘, 일본어 한 글자부터.</h1><p>글자를 읽는 법부터 익히고, 여행에서도 말해 봐요.</p></section><div class="stats"><div class="stat"><b>${total}</b><span>익힌 글자·표현</span></div><div class="stat"><b>${pending}</b><span>다시 볼 항목</span></div><div class="stat"><b>${state.seen}</b><span>퀴즈 정답 누적</span></div></div><div class="section">✦ 첫걸음 학습 코스</div>${[["h","あ","히라가나","일본어 글자 46개"],["k","ア","가타카나","외래어를 읽는 글자 46개"],["v","旅","기초 단어·여행 표현","실제로 사용하는 12개 표현"]].map(([t,g,n,d])=>`<div class="tile"><div class="glyph">${g}</div><div class="detail"><b>${n}</b><div class="mut">${d} · ${stats(t)}/${DATA[t].length} 학습</div></div><button onclick="start('${t}')">학습</button></div>`).join("")}<div class="section">🧠 잊지 않게 복습하기</div><button class="primary" onclick="startQuiz()">복습 퀴즈 시작 →</button><button class="sub" onclick="reviewMissed()">틀린 글자 집중 복습</button><div class="section">나의 학습 도구</div><button class="sub" onclick="weakPage()">취약 카드 관리</button><button class="sub" onclick="missionPage()">여행 회화 미션</button><button class="sub" onclick="statsPage()">학습 통계 · JSON 백업·복원</button><div class="section">학습 도움말</div><div class="settings"><div><b>발음 버튼 🔊</b><div class="tiny">기기에 설치된 일본어 음성으로 들려줘요</div></div><span class="glyph" style="font-size:22px;width:43px;height:43px">音</span></div><div class="tip">처음엔 로마자와 한글 발음 힌트를 함께 봐요. 익숙해지면 퀴즈에서 일본어만 보고 소리를 떠올려 보세요. 한글 표기는 근사치이므로 실제 소리를 함께 들어야 해요.</div><div class="foot">영어 Oxford 앱과 별개의 저장소·학습 기록을 사용합니다.</div>`}
function start(t){mode=t;idx=0;view="learn";render()}
function learn(){const arr=DATA[mode],x=arr[idx],key=mode+idx;app.innerHTML=`<button class="back" onclick="goHome()">← 홈</button><div class="top"><b>${label(mode)} 배우기</b><span class="mut">${idx+1} / ${arr.length}</span></div><div class="progress"><i style="width:${(idx+1)/arr.length*100}%"></i></div><div class="card"><span class="pill">${label(mode)}</span><div class="char" style="${mode==="v"?"font-size:clamp(42px,12vw,70px);margin:28px 0 12px":""}">${esc(x[0])}</div><div class="roman">${esc(x[1])}</div><div class="reading">${esc(x[2])}</div><div class="controls"><button onclick="speak('${x[0]}')">🔊 발음 듣기</button><button onclick="speak('${x[0]}')">↻ 다시 듣기</button></div><div class="tip">${mode==="v"?esc(x[3]):"소리를 듣고 직접 따라 말한 다음, 글자 모양을 손가락으로 따라 써 보세요. 일본어 소리와 한글 소리가 완전히 같지는 않아요."}</div></div><div class="controls"><button onclick="move(-1)" ${idx===0?"disabled":""}>← 이전</button><button onclick="mark()">${state.learned[key]?"✓ 학습함":"✓ 배웠어요"}</button></div><button class="primary" onclick="move(1)">${idx===arr.length-1?"학습 마치고 퀴즈 →":"다음 글자 →"}</button><div class="foot">학습 기록은 현재 브라우저에 저장돼요.</div>`}
function mark(){const key=mode+idx;state.learned[key]=true;const now=Date.now();if(!state.review[key])state.review[key]={step:0,next:now+86400000};save();render()}
function move(n){if(idx+n<0)return;if(idx+n>=DATA[mode].length){startQuiz(mode);return}idx+=n;render()}
function goHome(){view="home";render()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function begin(keys,active=false){if(!keys.length){alert("지금 복습할 항목이 없어요. 새 글자를 배우거나 나중에 다시 와 주세요.");return}quiz=keys;qidx=0;answered=false;recall=active;view="quiz";render()}
function startQuiz(t){const all=t?ids.filter(id=>id[0]===t):ids;begin(L.queue(state,all))}
function reviewMissed(){begin(ids.filter(id=>(state.weak[id]?.locked||state.mistakes[id]>0)&&(!state.review[id]||state.review[id].next<=Date.now())).slice(0,10),true)}
function quizView(){if(qidx>=quiz.length){app.innerHTML=`<button class="back" onclick="goHome()">← 홈</button><div class="card"><div class="char" style="font-size:80px">🎉</div><h2>복습 완료!</h2><p>오늘 본 글자를 내일 다시 만나면 훨씬 오래 기억할 수 있어요.</p></div><button class="primary" onclick="goHome()">홈으로 돌아가기</button>`;return}
mode=quiz[qidx][0];const i=+quiz[qidx].slice(1),x=DATA[mode][i],arr=DATA[mode];let opts=shuffle([i,...shuffle(arr.map((_,j)=>j).filter(j=>j!==i&&arr[j][1]!==x[1])).slice(0,3)]);app.innerHTML=`<button class="back" onclick="goHome()">← 홈</button><div class="top"><b>기억 확인 · ${label(mode)}</b><span class="mut">${qidx+1} / ${quiz.length}</span></div><div class="progress"><i style="width:${qidx/quiz.length*100}%"></i></div><div class="card"><div class="pill">읽는 법을 골라 보세요</div><div class="char" style="${mode==="v"?"font-size:50px;margin:24px 0":""}">${esc(x[0])}</div><button onclick="speak('${x[0]}')">🔊 소리 듣기</button><div id="options" class="choices" ${recall?'hidden':''}>${opts.map(j=>`<button data-j="${j}" onclick="answer(${j})">${esc(arr[j][1])}</button>`).join("")}</div>${recall?'<p>먼저 소리를 떠올려 직접 말해 보세요.</p><button onclick="revealRecall()">정답 보기</button><div id="recall-answer" hidden></div>':''}<div id="feedback" class="feedback" aria-live="polite"></div></div><button id="next" class="primary" onclick="nextQuestion()" disabled>다음 문제 →</button>`}
function answer(j){if(answered)return;answered=true;const i=+quiz[qidx].slice(1),key=mode+i,correct=j===i,box=document.getElementById("options");box.querySelectorAll("button").forEach(b=>{b.disabled=true;if(+b.dataset.j===i)b.classList.add("good");else if(+b.dataset.j===j)b.classList.add("bad")});document.getElementById("feedback").textContent=correct?"정답이에요! 잘했어요.":"아쉬워요. 정답은 "+DATA[mode][i][1]+"예요.";document.getElementById("next").disabled=false;L.record(state,key,correct,recall?"recall":"quiz");save()}
function revealRecall(){const x=DATA[mode][+quiz[qidx].slice(1)],el=document.getElementById("recall-answer");el.hidden=false;el.innerHTML='<p>'+esc(x[1])+' · '+esc(x[2])+'</p><button onclick="answer(-1)">다시 배울래요 · 10분 뒤</button> <button onclick="answer('+Number(quiz[qidx].slice(1))+')">스스로 기억했어요</button>'}
function nextQuestion(){if(!answered)return;qidx++;answered=false;render()}
render();
</script></body></html>
